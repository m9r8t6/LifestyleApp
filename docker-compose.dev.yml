# Local test stack: http://localhost:8099
#   docker compose -f docker-compose.dev.yml up -d --build
# Data lives in a throwaway volume; `down -v` wipes it.

services:
  lifestyle-db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: lifestyle_db
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - lifestyle_dev_db:/var/lib/postgresql/data

  lifestyle-api:
    build: ./api
    environment:
      LIFESTYLE_DATABASE_URL: postgres://postgres:dev@lifestyle-db:5432/lifestyle_db
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LIFESTYLE_PUBLIC_URL: ${LIFESTYLE_PUBLIC_URL:-http://localhost:8099}
      LIFESTYLE_GOOGLE_CLIENT_ID: ${LIFESTYLE_GOOGLE_CLIENT_ID:-}
      LIFESTYLE_GOOGLE_CLIENT_SECRET: ${LIFESTYLE_GOOGLE_CLIENT_SECRET:-}
      LIFESTYLE_TOKEN_KEY: ${LIFESTYLE_TOKEN_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      LIFESTYLE_MAIL_SMTP_PORT: "3465"
      LIFESTYLE_MAIL_TLS_INSECURE: "true"   # the test mail server below uses a self-signed certificate
    depends_on:
      - lifestyle-db

  # Test mail server (IMAPS on mail.dev.test:3993, SMTP on localhost:3025, mailbox info@ainstein.test / secret)
  greenmail:
    image: greenmail/standalone:2.1.2
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=info:secret@ainstein.test,office:secret@basement.test -Dgreenmail.users.login=email
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3993:3993"
      - "127.0.0.1:3465:3465"
    networks:
      default:
        aliases:
          - mail.dev.test

  lifestyle-web:
    build: ./web
    ports:
      - "127.0.0.1:8099:80"
    depends_on:
      - lifestyle-api

volumes:
  lifestyle_dev_db:
