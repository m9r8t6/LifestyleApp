# Behind the Cloudflare tunnel the original scheme arrives in X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.googleapis.com https://gmail.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Always revalidate so a deploy shows up on the next load; unchanged files answer with 304.
    add_header Cache-Control "no-cache" always;

    location /api/ {
        proxy_pass http://lifestyle-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 12m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
