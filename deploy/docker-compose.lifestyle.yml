# LifeOS on the home server (~/ai-backend). Kept out of the master compose file;
# it runs as its own project and only joins the existing networks.
#
#   cd ~/ai-backend
#   docker compose -p lifestyle -f docker-compose.lifestyle.yml up -d --build
#
# Secrets come from ~/ai-backend/.env (LIFESTYLE_DB_PASS, LIFESTYLE_TUNNEL_TOKEN, DEEPSEEK_API_KEY).

services:
  lifestyle-web:
    build: ./apps/lifestyle-web
    container_name: lifestyle-web
    restart: unless-stopped
    ports:
      - "3110:80"
    depends_on:
      lifestyle-api:
        condition: service_healthy
    networks:
      - lifestyle_net
    deploy:
      resources:
        limits:
          memory: 64M

  # Own Cloudflare tunnel (separate account from the other apps). The public
  # hostname is set in the Cloudflare dashboard and must point to http://lifestyle-web:80
  lifestyle-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: lifestyle-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${LIFESTYLE_TUNNEL_TOKEN}
    depends_on:
      - lifestyle-web
    networks:
      - lifestyle_net
    deploy:
      resources:
        limits:
          memory: 128M

  lifestyle-api:
    build: ./apps/lifestyle-api
    container_name: lifestyle-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      LIFESTYLE_DATABASE_URL: postgres://${LIFESTYLE_DB_USER:-lifestyle}:${LIFESTYLE_DB_PASS}@shared_postgres_db:5432/${LIFESTYLE_DB_NAME:-lifestyle_db}
      LIFESTYLE_ALLOW_SIGNUP: ${LIFESTYLE_ALLOW_SIGNUP:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Google connection held by the server (all four are needed to switch it on)
      LIFESTYLE_PUBLIC_URL: ${LIFESTYLE_PUBLIC_URL:-}
      LIFESTYLE_GOOGLE_CLIENT_ID: ${LIFESTYLE_GOOGLE_CLIENT_ID:-}
      LIFESTYLE_GOOGLE_CLIENT_SECRET: ${LIFESTYLE_GOOGLE_CLIENT_SECRET:-}
      LIFESTYLE_TOKEN_KEY: ${LIFESTYLE_TOKEN_KEY:-}
      TZ: Europe/Berlin
    networks:
      - lifestyle_net
      - backend_net    # shared Postgres
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  lifestyle_net:
  backend_net:
    name: ai-backend_backend_net
    external: true
